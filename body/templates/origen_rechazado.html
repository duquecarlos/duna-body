<!doctype html>
<html lang="{{ t.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#F4F2ED">
<title>{{ t('origen_rechazado.title') }} · {{ t('app.name') }}</title>
<script>/* theme before paint: no flash */
try{var th=localStorage.getItem('body.theme');var dark=th==='dark'||(th!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);if(dark)document.documentElement.dataset.theme='dark'}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ static_url('body.css') }}">
<link rel="icon" href="{{ static_url('icon.svg') }}" type="image/svg+xml">
</head>
<body>
<div class="shell"><main><div class="wrap">
<div class="top"><div><h1>{{ t('origen_rechazado.title') }}</h1></div></div>
<div class="card">
  <p class="read">{{ t('origen_rechazado.text') }}</p>
  <p style="margin-top:16px"><a class="taplink" href="/">{{ t('origen_rechazado.volver') }}</a></p>
</div>
</div></main></div>
</body>
</html>
